<!-- Описание: Шаблон для отображения архива всех статей блога -->
<!DOCTYPE html>
<html>
    <head>
        <!-- Заголовок страницы - отображается во вкладке браузера -->
        <title>Архив статей</title>
        </head>
         <!-- Блок заголовка страницы -->
         <div class="header">
        <!-- Название блога -->
         <h1> KSIMAN Studios (Orlova Kseniya UBST2201) </h1>
         </div>
    <body>
        <!-- Блок archive - контейнер для списка статей -->
        <!-- class="archive" - класс для стилизации блока архива -->
        <div class="archive">
            
            <!-- Шаблонный тег for - цикл для перебора всех статей -->
            <!-- % for post in posts % - начало цикла -->
            <!-- post - переменная, содержащая текущую статью на каждой итерации -->
            <!-- posts - список всех статей, переданный из представления -->
            <!-- Аналогичная реализация в Python: for item in list: -->
            {% for post in posts %}
            
            <!-- Блок one-post - контейнер для одной статьи -->
            <!-- Повторяется для каждой статьи в списке posts -->
            <div class="one-post">
                
                <!-- Заголовок статьи -->
                <!-- {{ post.title }} - шаблонная переменная, выводит значение поля title -->
                <!-- Двойные фигурные скобки используются для вывода переменных -->
                <!-- Аналогичная реализация:  object.field_name  -->
                <h2 class="post-title">{{ post.title }}</h2>
                
                <!-- Блок с информацией о статье (автор и дата) -->
                <!-- Два div элемента объединены в один контейнер для удобства верстки -->
                <div class="article-info">
                    
                    <!-- Имя автора статьи -->
                    <!-- post.author - объект User, связанный с статьей -->
                    <!-- post.author.username - имя пользователя автора -->
                    <!-- Точка используется для доступа к атрибутам объекта -->
                    <div class="article-author">{{ post.author.username }}</div>
                    
                    <!-- Дата создания статьи -->
                    <!-- post.created_date - значение поля created_date модели -->
                    <div class="article-created-date">{{ post.created_date }}</div>
                    
                </div>
                
                <!-- Краткое содержание статьи -->
                <!-- post.get_excerpt - вызов метода модели для получения превью текста -->
                <!-- Методы модели можно вызывать в шаблоне как атрибуты (без скобок) -->
                <p class="article-text">{{ post.get_excerpt }}</p>
                
            </div>
            
            <!-- Закрывающий тег цикла for -->
            <!--{% endfor % - обязательный тег завершения цикла в Django -->
            <!-- Аналогичная реализация в Python: отступ определяет конец цикла -->
            {% endfor %}
            
        </div>
    </body>
</html>
